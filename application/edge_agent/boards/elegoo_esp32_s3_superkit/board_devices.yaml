devices:
  - name: display_lcd
    chip: ssd1306
    type: custom
    version: default
    config:
      i2c_addr: 0x3C              # I2C device address
      scl_speed_hz: 100000         # I2C clock speed (Hz)
      lcd_cmd_bits: 8             # LCD command bits
      lcd_param_bits: 8            # LCD parameter bits
      reset_gpio_num: -1           # Reset GPIO number, -1 if not used
      mirror_x: false              # Mirror display horizontally
      mirror_y: false              # Mirror display vertically
      swap_xy: false               # Swap X and Y coordinates
      invert_color: true           # Invert display colors
      x_max: 128                  # Maximum X resolution
      y_max: 64                  # Maximum Y resolution
    peripherals:
      - name: i2c_master
      - name: ledc_backlight
